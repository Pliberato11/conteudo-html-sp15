<DOCTYPE! html>
<html langue="pt-br">
  <head>
    <title>Conteúdo Aula 13 - HTML</title>
    <style>
      .importante {
        color:red;
        font-weight: bold;
        font-size: 150%;
      }
        .cidades {
          background-color: purple;
          border: 6px solid darkorchid;
          padding: 10px;
        }
          .centralizado {
            text-align: center;
          }
          .estilo {
          background-color: navy;
          color: aliceblue;
          border: 4px solid goldenrod;
          padding: 10px;
          }
    </style>
  </head>
  <body>
    <h1>Class em HTML</h1>
      <h2>Título <span class="importante">importante</span> em HTML</h2>
      <p>Exemplo de conteúdo <span class="importante">importante</span> no HTML</p>

<hr>

      <h3>Definindo mais de uma classe para elementos</h3>
        <h2 class="cidades centralizado">São Paulo</h2>
        <h2 class="cidades">Rio de Janeiro</h2>
        <h2 class="cidades">Natal</h2>

<hr>

        <h3>Mesmas classes  em elementos diferentes</h3>
          <h2 style=color:white class="estilo">Eu sou um h2 estiloso</h2>
          <p style=color:white class="estilo">Eu sou um parágrafo bem bonito</p>

<hr>
  </body>
</html>
