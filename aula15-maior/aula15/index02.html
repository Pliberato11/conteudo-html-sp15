<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Conteúdo Aula 15 - HTML</title>
</head>
<body>
  <h1>Caminhos de Arquivos no HTML</h1>
    <h3>Arquivo no mesmo nível do HTML</h3>
    <img src="nada-pra-ver-aqui.jpg" width="500" height="301">

<hr>

      <h3>Arquivo em uma pasta de mesmo nível que o HTML</h3>
      <img src="img/nada-pra-ver-aqui.jpg" width="500" height="301">

<hr>

        <h3>Arquivo em uma pasta na raiz da estrutura</h3>
        <img src="/aula15-img/nada-pra-ver-aqui.jpg">

<hr>

          <h3>Arquvo em um nível maior que o HTML</h3>
          <img src="../nada-pra-ver-aqui copy.jpg">
</body>
</html>
