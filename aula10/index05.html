<!DOCTYPE html>
<html langue="pt-br">
  <head>
    <title>Conteúdo Aula 10 - HTML</title>
  </head>
  <body>
    <h1>Definindo Listas no HTML</h1>
      <h3> Exemplo de lista não ordenada</h3>
    <ul>
      <li>Pro</li>
      <li>fessor</li>
      <li>Tá</li>
      <li>Com</li>
      <li>Pressa</li>
    </ul>

<hr>

<h3> Exemplo de lista ordenada</h3>
    <ol>
      <li>Acabou</li>
      <li>É</li>
      <li>Tetra</li>
      <li>É</li>
      <li>Tetra</li>
    </ol>
  </body>
</html>
