<!doctype html>
<html langue="pt-br">
  <head>
    <title>Conteúdo Aula10 - HTML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <h1>Utilizando elemento picture no HTML</h1>

    <picture>
    <source media="(min-width:650px)" srcset="img/pocket.jpg"> <!--largura mínima pra aparecer a foto do celuar-->
    <source media="(min-width:450px)" srcset="img/pc.jpg"> <!--largura mínima pra aparecer a foto do computador-->
    <img src="img/abapuru.jpg" width="200" height="300"> <!--largura mínima pra aparecer a pintura do pé grande-->
    </picture>
  </body>
</html>
