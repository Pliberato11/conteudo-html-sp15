<!DOCTYPE html>
<html langue="pt-br">
  <head>
    <title>Conteúdo Aula 09 - HTML</title>

  <body>
  <h1>Definindo imagem no HTML</h1>
  <img src="img/olympiacos.jpg"
       alt="Esquadrão Piraeus"
       width="340"
       height="300">

<hr>

    <h3>Definindo altura e largura da imagem com CSS</h3>
    <img src="img/olympiacos.jpg"
         alt="Esquadrão Piraeus"
         style="width: 240px; height: 150px;">
      <h3>Utilizando imagens dinâmicas no HTML</h3>
      <img src="img/giphy.gif"
           style="width: 100px; height: 100px;">
          
<hr>

<h3>Utilizando imagem flutuante</h3>
<p>
  <img src= "img/giphy.gif" 
       style="width: 50px; height: 50px; float: right;"> Somente a dor coletiva gera união.</p>
  </body>
