<!DOCTYPE html>
<html langue="pt-br">
<head>
  <title>Conteúdo Aula 14 -HTML</title>
</head>
<body>
  <h1>JavaScript no HTML</h1>
  <button onclick="document.getElementById('ex1').innerHTML = Date()">Adicionar Hora e Data</button>
  <p id="ex1"></p>

<hr>

    <h3>Inserindo conteúdo em elementos com o JavaSript</h3>
    <p id="ex2"></p>
    <script>
        //Inserindo conteúdo com o JavaScript
      document.getElementById('ex2').innerHTML = "Olá, SP15!";
    </script>

<hr>

      <h3>Alternando estilo de elementos com o JavaScript</h3>
      <p id="ex3">Somente a dor coletiva gera união!</p>
      <button onclick="adicionarEstilo()">Alternar Estilo</button>
      <script>
          //Alternando estilo de elemento com o JavaScript
        function adicionarEstilo() {
          document.getElementById('ex3').style.color = "darkred";
          document.getElementById('ex3').style.backgroundColor = "black";
          document.getElementById('ex3').style.border = "4px solid darkred";
          document.getElementById('ex3').style.padding = "10px";
          document.getElementById('ex3').style.fontFamily = "sans-serif";
        }
      </script>
</body>
</html>
